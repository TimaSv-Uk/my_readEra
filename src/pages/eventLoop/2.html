<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Page - New Event Card Layout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        /* --- DESIGN TOKENS (Updated) --- */
        :root {
            --primary: #5b9ff7;
            --accent: #eee154;
            --text-dark: #3e627f;
            --text-secondary: #5b7082;
            --bg-surface: #fdfdfd;
            --bg-secondary: #f4f6f8;
            --tag-bg: #41cae4;
            --danger: #e74c3c;
            /* Added for decline button */
            --border-light: #eee;

            --spacing-sm: 8px;
            --spacing-md: 16px;

            --radius-md: 12px;
            --radius-lg: 16px;
        }

        /* --- BASE Reset --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-dark);
            padding: 20px;
            line-height: 1.4;
        }

        h3 {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 18px;
            color: var(--text-dark);
        }

        /* --- WRAPPER for demo --- */
        .demo-container {
            max-width: 400px;
            margin: 0 auto;
        }


        /* =========================================
           NEW EVENT CARD COMPONENT
        ========================================= */
        .event-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
            overflow: hidden;
            /* Ensures expanding poll stays within corners */
            transition: all 0.3s ease;
        }

        /* 1. Header Section: Title & Participants Status */
        .card-header {
            margin-bottom: var(--spacing-md);
        }

        .card-header h3 {
            margin-bottom: 8px;
        }

        .participants-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* --- 1. DEADLINE BADGE (NEW) --- */
        .deadline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--warning-bg);
            color: var(--warning-text);
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            /* Відступ від заголовка */
        }

        .deadline-badge svg {
            width: 14px;
            height: 14px;
        }

        /* Visual Progress Bar indicating 0/10 */
        .status-bar-bg {
            flex-grow: 1;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
        }

        .status-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.5s ease-out;
        }

        /* 2. Body Section: Description & Tags */
        .short-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: var(--spacing-md);
        }

        .tag {
            background-color: var(--tag-bg);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        /* 3. Footer Section: Map Link & Action Buttons */
        .card-footer {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-light);
            padding-bottom: 8px;
        }

        .map-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #4a8fe8;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background-color: #fff0f0;
        }

        /* =========================================
           POLL CARD SECTION (Hidden by default)
        ========================================= */
        .poll-container {
            max-height: 0;
            /* Hidden state */
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            /* Smooth expand animation */
            background-color: #f8fbff;
            /* Slightly different background for context */
            margin: 0 -16px -16px -16px;
            /* Negative margin to stretch full width */
            padding: 0 16px;
            /* Restore padding internal */
        }

        .poll-container.active {
            /* Set a max-height larger than content, or use JS for dynamic height. 
                Fixed height for CSS-only demo simplicity. */
            max-height: 300px;
            padding-top: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-top: 1px solid var(--border-light);
        }

        .poll-title {
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
        }

        .poll-options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        /* Styling Radio buttons as clickable cards */
        .poll-option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
        }

        .poll-option-label:hover {
            border-color: var(--primary);
        }

        /* Hide actual radio, style label based on checked state */
        .poll-option-label input[type="radio"] {
            accent-color: var(--primary);
            margin-right: 10px;
            transform: scale(1.2);
        }

        .poll-option-label:has(input:checked) {
            border-color: var(--primary);
            background-color: #f0f8ff;
            font-weight: 500;
        }

        .btn-submit-poll {
            width: 100%;
            background-color: var(--accent);
            color: var(--text-dark);
        }
    </style>
</head>

<body>

    <div class="demo-container">



        <div class="event-card">

            <div class="deadline-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Голосування завершено</span>
            </div>

            <div class="card-header">
                <h3>Workshop: JS Advanced</h3>

                <div class="participants-status">
                    <div class="status-bar-bg">
                        <div class="status-bar-fill" style="width: 100%; background-color: #e74c3c;"></div>
                    </div>
                    <span style="color: #e74c3c; font-weight: 700;">Повна група 15/15</span>
                </div>
            </div>

            <p class="short-desc">Воркшоп заповнено. Ви можете підписатися на сповіщення, якщо хтось відмовиться.</p>

            <div class="tags-container">
                <span class="tag">#Coding</span>
                <span class="tag">#Education</span>
            </div>

            <div class="card-footer">
                <a href="#" class="map-link">📍 Офіс Google, Київ</a>

                <div class="action-buttons">
                    <button class="btn btn-notify" onclick="alert('Ми надішлемо вам email, якщо з\'явиться місце!')">
                        🔔 Повідомити, якщо звільниться місце
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function togglePoll(btn) {
            const card = btn.closest('.event-card');
            const poll = card.querySelector('.poll-container');
            if (poll) { // Перевірка, чи існує блок голосування (бо в повній картці його немає)
                poll.classList.toggle('active');
                if (poll.classList.contains('active')) {
                    btn.innerText = "Згорнути";
                } else {
                    btn.innerText = "Взяти участь";
                }
            }
        }
    </script>
</body>

</html>
